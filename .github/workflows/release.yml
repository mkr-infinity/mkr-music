name: Production Release Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (Optional)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build_apks:
    name: Build & Package MKR Music APKs
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate and Extract Version Info
        id: version_info
        run: |
          echo "=== Validating Canonical Version Configuration ==="
          if [ ! -f "version.properties" ]; then
            echo "::error file=version.properties::Canonical version file 'version.properties' not found at repository root!"
            exit 1
          fi

          # Extract APP_VERSION line strictly
          RAW_APP_VERSION=$(grep "^APP_VERSION=" version.properties | head -n 1 | cut -d'=' -f2- | tr -d ' \r\n')
          if [ -z "$RAW_APP_VERSION" ]; then
            echo "::error file=version.properties::Missing or empty 'APP_VERSION' key in version.properties!"
            exit 1
          fi

          echo "Found APP_VERSION in version.properties: '$RAW_APP_VERSION'"

          # Validate strict semantic version format: MAJOR.MINOR.PATCH
          if [[ ! "$RAW_APP_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error file=version.properties::Invalid APP_VERSION format '$RAW_APP_VERSION'. Must strictly follow MAJOR.MINOR.PATCH (e.g., 1.0.0)."
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          # Validate range limits
          if (( 10#$MINOR > 99 )); then
            echo "::error file=version.properties::MINOR version '$MINOR' exceeds supported range (0..99)."
            exit 1
          fi
          if (( 10#$PATCH > 99 )); then
            echo "::error file=version.properties::PATCH version '$PATCH' exceeds supported range (0..99)."
            exit 1
          fi
          if (( 10#$MAJOR > 214748 )); then
            echo "::error file=version.properties::MAJOR version '$MAJOR' exceeds supported range (0..214748)."
            exit 1
          fi

          # Compute deterministic versionCode: MAJOR * 10000 + MINOR * 100 + PATCH
          COMPUTED_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))

          # Ensure strictly greater than historical published version code 77
          if (( COMPUTED_CODE <= 77 )); then
            echo "::error file=version.properties::Computed versionCode ($COMPUTED_CODE) must be strictly greater than historical version code 77."
            exit 1
          fi

          echo "✓ Canonical Version Name: $RAW_APP_VERSION"
          echo "✓ Computed Version Code: $COMPUTED_CODE"
          echo "version_name=$RAW_APP_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$COMPUTED_CODE" >> $GITHUB_OUTPUT

      - name: Verify Gradle Version Alignment
        run: |
          echo "Verifying Gradle configuration matches canonical version..."
          GRADLE_OUT=$(./gradlew :app:printAppVersion -q --console=plain)
          echo "$GRADLE_OUT"
          GRADLE_VN=$(echo "$GRADLE_OUT" | grep "CANONICAL_VERSION_NAME=" | cut -d'=' -f2 | tr -d ' \r\n')
          GRADLE_VC=$(echo "$GRADLE_OUT" | grep "COMPUTED_VERSION_CODE=" | cut -d'=' -f2 | tr -d ' \r\n')

          if [ "$GRADLE_VN" != "${{ steps.version_info.outputs.version_name }}" ]; then
            echo "::error::Version Name mismatch! Workflow: ${{ steps.version_info.outputs.version_name }}, Gradle: $GRADLE_VN"
            exit 1
          fi
          if [ "$GRADLE_VC" != "${{ steps.version_info.outputs.version_code }}" ]; then
            echo "::error::Version Code mismatch! Workflow: ${{ steps.version_info.outputs.version_code }}, Gradle: $GRADLE_VC"
            exit 1
          fi
          echo "✓ Workflow and Gradle version definitions are 100% aligned ($GRADLE_VN / $GRADLE_VC)."

      - name: Check Keystore Availability
        id: check_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Custom Keystore secret detected."
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "No custom Keystore secret found. Using standard signing fallback."
          fi

      - name: Generate Signing Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MKR Music,O=MKR,C=US"

      - name: Build Universal Release APK
        run: |
          echo "Building single Universal APK variant (including all supported ABIs)..."
          ./gradlew assembleUniversalGmsRelease \
            --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Sign Universal APK with Custom Keystore
        if: steps.check_keystore.outputs.has_keystore == 'true'
        id: sign_universal
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/universalGms/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Prepare and Validate Release Assets
        id: prepare_assets
        run: |
          mkdir -p release_assets

          if [ "${{ steps.check_keystore.outputs.has_keystore }}" == "true" ]; then
            UNIVERSAL_SRC="${{ steps.sign_universal.outputs.signedFile }}"
          else
            UNIVERSAL_SRC=$(find app/build/outputs/apk/universalGms/release/ -name "*.apk" | head -n 1)
          fi

          echo "Universal source: $UNIVERSAL_SRC"

          if [ -z "$UNIVERSAL_SRC" ] || [ ! -f "$UNIVERSAL_SRC" ]; then
            echo "::error::Built Universal APK file not found!"
            exit 1
          fi

          # Copy and rename to exact required filename
          cp "$UNIVERSAL_SRC" release_assets/mkr-music-universal.apk

          echo "=== Validating Generated Universal APK ==="
          apk_path="release_assets/mkr-music-universal.apk"
          if [ ! -f "$apk_path" ]; then
            echo "::error::Required APK mkr-music-universal.apk is missing!"
            exit 1
          fi
          size=$(wc -c < "$apk_path")
          if [ "$size" -lt 1000000 ]; then
            echo "::error::Required APK mkr-music-universal.apk is suspiciously small ($size bytes)!"
            exit 1
          fi
          echo "✓ Verified mkr-music-universal.apk ($size bytes)"

          echo "=== Inspecting Native ABIs in Universal APK ==="
          unzip -l release_assets/mkr-music-universal.apk | grep "lib/" | head -n 15 || echo "No lib entries"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mkr-music-universal-apk-v${{ steps.version_info.outputs.version_name }}
          path: release_assets/mkr-music-universal.apk
          if-no-files-found: error

      - name: Write Step Summary
        run: |
          UNIVERSAL_SIZE=$(ls -lh release_assets/mkr-music-universal.apk | awk '{print $5}')

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 MKR Music Build Complete — v${{ steps.version_info.outputs.version_name }} (Build ${{ steps.version_info.outputs.version_code }})

          The single Universal APK has been generated and packaged successfully with all supported architectures:

          | Variant | Target ABI | Filename | Size | Version Name | Version Code |
          | :--- | :--- | :--- | :--- | :--- | :--- |
          | **Universal** | All Supported ABIs (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86\`, \`x86_64\`) | \`mkr-music-universal.apk\` | $UNIVERSAL_SIZE | \`v${{ steps.version_info.outputs.version_name }}\` | \`${{ steps.version_info.outputs.version_code }}\` |

          ### 📦 Download Artifacts
          Download the compiled APK directly from the **Artifacts** section at the top of this run (\`mkr-music-universal-apk-v${{ steps.version_info.outputs.version_name }}\`).
          EOF

      - name: Generate Beautiful Release Notes
        if: github.event.inputs.publish_release == 'true'
        env:
          VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
        shell: python
        run: |
          import os

          version_name = os.environ.get('VERSION_NAME', '')
          banner_url = "https://raw.githubusercontent.com/mkr-infinity/mkr-music/main/assets/banner.png"

          body = f"""<p align="center">
            <img src="{banner_url}" alt="MKR Music Banner" width="100%" />
          </p>

          # MKR Music v{version_name}

          > ### Release Highlights
          > This milestone update delivers instant audio playback streaming, intelligent delayed background caching, expressive Material 3 UI refinements, and streamlined settings discovery.

          ---

          ### Low-Latency Streaming & Smart Caching
          - **Instant Audio Playback**: Bypasses initial cache write buffer lag to start track streaming immediately upon click.
          - **Configurable Cache Delay**: Added a dedicated slider under Storage & Cache (5s–90s, default 10s) to cache only songs you actually listen to.
          - **Zero Playback Lag**: Background caching runs on low-priority IO threads with automatic cancellation if a track is skipped or paused early.

          ### Visual Polish & Expressive Design
          - **Chainsaw Spikes Action Button**: Smooth animated moving teeth border on the Donate & Support button.
          - **Overhauled Contribution Sheet**: Rapid-copy UPI card with tactile spring click feedback, app badges, and rotating gratitude toasts.
          - **Balanced Onboarding Hero**: Centered MKR Music brand logo with structured layout and responsive viewport across all aspect ratios.
          - **Refined Accents**: Subtle borders applied to developer links and the home screen settings dropdown button.

          ### Settings Discovery & Direct Updates
          - **Granular Keyword Search**: Search across sub-options directly (e.g., searching "hide" brings up all hide toggles) with automatic deduplication.
          - **Simplified Update Guidance**: Direct repository releases with step-by-step backup instructions before updating.
          - **Clutter-Free Headers**: Cleaned up the settings toolbar by removing redundant action capsules.

          ### Storage Integrity & Protection
          - **Protected Downloads**: Explicit downloads and local library tracks are strictly safeguarded against LRU cache eviction.
          - **Configurable Capacity Limits**: Set maximum cached song limits (50 to 1000 items) alongside storage byte caps.

          ---

          ### Support Development
          MKR Music is 100% free and open-source. If you enjoy using the app, consider supporting continued development:
          - ☕ **Buy Me a Coffee**: https://buymeacoffee.com/mkr_infinity
          - 💸 **UPI**: `mkr-infinity@ybl`
          """

          with open("release_notes.txt", "w", encoding="utf-8") as f:
              f.write(body.strip())

      - name: Create GitHub Release & Upload Assets
        if: github.event.inputs.publish_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          
          # Delete existing release/tag with same name if it exists so re-running works cleanly
          gh release delete "v$VERSION_NAME" --yes || true
          git tag -d "v$VERSION_NAME" 2>/dev/null || true
          git push --delete origin "v$VERSION_NAME" 2>/dev/null || true

          gh release create "v$VERSION_NAME" release_assets/* \
            --title "MKR Music v$VERSION_NAME" \
            --notes-file release_notes.txt \
            --target main

