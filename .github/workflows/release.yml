name: Production Release Build

'on':
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (Optional)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build_apks:
    name: Build & Package MKR Music APKs
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate and Extract Version Info
        id: version_info
        run: |
          echo "=== Validating Canonical Version Configuration ==="
          if [ ! -f "version.properties" ]; then
            echo "::error file=version.properties::Canonical version file 'version.properties' not found at repository root!"
            exit 1
          fi

          # Extract APP_VERSION line strictly
          RAW_APP_VERSION=$(grep "^APP_VERSION=" version.properties | head -n 1 | cut -d'=' -f2- | tr -d ' \r\n')
          if [ -z "$RAW_APP_VERSION" ]; then
            echo "::error file=version.properties::Missing or empty 'APP_VERSION' key in version.properties!"
            exit 1
          fi

          echo "Found APP_VERSION in version.properties: '$RAW_APP_VERSION'"

          # Validate strict semantic version format: MAJOR.MINOR.PATCH
          if [[ ! "$RAW_APP_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error file=version.properties::Invalid APP_VERSION format '$RAW_APP_VERSION'. Must strictly follow MAJOR.MINOR.PATCH (e.g., 1.0.0)."
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          # Validate range limits
          if (( 10#$MINOR > 99 )); then
            echo "::error file=version.properties::MINOR version '$MINOR' exceeds supported range (0..99)."
            exit 1
          fi
          if (( 10#$PATCH > 99 )); then
            echo "::error file=version.properties::PATCH version '$PATCH' exceeds supported range (0..99)."
            exit 1
          fi
          if (( 10#$MAJOR > 214748 )); then
            echo "::error file=version.properties::MAJOR version '$MAJOR' exceeds supported range (0..214748)."
            exit 1
          fi

          # Compute deterministic versionCode: MAJOR * 10000 + MINOR * 100 + PATCH
          COMPUTED_CODE=$(( 10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH ))

          # Ensure strictly greater than historical published version code 77
          if (( COMPUTED_CODE <= 77 )); then
            echo "::error file=version.properties::Computed versionCode ($COMPUTED_CODE) must be strictly greater than historical version code 77."
            exit 1
          fi

          echo "✓ Canonical Version Name: $RAW_APP_VERSION"
          echo "✓ Computed Version Code: $COMPUTED_CODE"
          echo "version_name=$RAW_APP_VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$COMPUTED_CODE" >> $GITHUB_OUTPUT

      - name: Verify Gradle Version Alignment
        run: |
          echo "Verifying Gradle configuration matches canonical version..."
          GRADLE_OUT=$(./gradlew :app:printAppVersion -q --console=plain)
          echo "$GRADLE_OUT"
          GRADLE_VN=$(echo "$GRADLE_OUT" | grep "CANONICAL_VERSION_NAME=" | cut -d'=' -f2 | tr -d ' \r\n')
          GRADLE_VC=$(echo "$GRADLE_OUT" | grep "COMPUTED_VERSION_CODE=" | cut -d'=' -f2 | tr -d ' \r\n')

          if [ "$GRADLE_VN" != "${{ steps.version_info.outputs.version_name }}" ]; then
            echo "::error::Version Name mismatch! Workflow: ${{ steps.version_info.outputs.version_name }}, Gradle: $GRADLE_VN"
            exit 1
          fi
          if [ "$GRADLE_VC" != "${{ steps.version_info.outputs.version_code }}" ]; then
            echo "::error::Version Code mismatch! Workflow: ${{ steps.version_info.outputs.version_code }}, Gradle: $GRADLE_VC"
            exit 1
          fi
          echo "✓ Workflow and Gradle version definitions are 100% aligned ($GRADLE_VN / $GRADLE_VC)."

      - name: Validate Release Signing Secrets
        run: |
          echo "=== Validating Required GitHub Release Signing Secrets ==="
          MISSING=0
          if [ -z "${{ secrets.KEYSTORE }}" ]; then
            echo "::error::Required secret 'KEYSTORE' is missing or empty!"
            MISSING=1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Required secret 'KEYSTORE_PASSWORD' is missing or empty!"
            MISSING=1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "::error::Required secret 'KEY_ALIAS' is missing or empty!"
            MISSING=1
          fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Required secret 'KEY_PASSWORD' is missing or empty!"
            MISSING=1
          fi

          if [ "$MISSING" -ne 0 ]; then
            echo "::error::All four release signing secrets (KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) must be configured in GitHub Secrets. Failing build immediately."
            exit 1
          fi
          echo "✓ All four required release signing secrets are present."

      - name: Setup and Validate Persistent Release Keystore
        id: keystore_validation
        run: |
          echo "=== Decoding and Validating Persistent Release Keystore ==="
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE }}" | base64 -d > app/keystore/release.keystore

          if [ ! -s app/keystore/release.keystore ]; then
            echo "::error::Decoded release keystore file is empty or invalid!"
            exit 1
          fi

          echo "Validating keystore integrity and alias with keytool..."
          if ! keytool -list -keystore app/keystore/release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" > /dev/null 2>&1; then
            echo "::error::Keystore validation failed! Keystore is corrupt, password is wrong, or alias '${{ secrets.KEY_ALIAS }}' does not exist."
            exit 1
          fi

          # Extract canonical SHA-256 certificate fingerprint directly from the configured release keystore
          EXPECTED_FINGERPRINT=$(keytool -exportcert -keystore app/keystore/release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" | sha256sum | awk '{print $1}' | tr '[:lower:]' '[:upper:]')

          if [ -z "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::Failed to compute SHA-256 fingerprint from release keystore certificate!"
            exit 1
          fi

          echo "expected_cert_sha256=$EXPECTED_FINGERPRINT" >> $GITHUB_OUTPUT
          echo "✓ Persistent release keystore validated successfully (Alias: ${{ secrets.KEY_ALIAS }})."
          echo "✓ Expected Signer Certificate SHA-256: $EXPECTED_FINGERPRINT"

      - name: Build Universal Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building single Universal APK variant directly signed by Gradle with persistent release keystore..."
          ./gradlew :app:assembleUniversalRelease \
            --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Prepare, Validate & Provenance Universal APK
        id: prepare_assets
        run: |
          mkdir -p release_assets

          GRADLE_APK="app/build/outputs/apk/universal/release/app-universal-release.apk"
          echo "Expected Gradle Universal Release APK: '$GRADLE_APK'"

          # Strictly require the exact Gradle-generated Universal Release APK output without arbitrary fallback
          if [ ! -f "$GRADLE_APK" ]; then
            echo "::error::Exact Gradle Universal Release APK not found at '$GRADLE_APK'! Failing workflow."
            exit 1
          fi

          # Copy exact Gradle output to mandatory release asset filename
          cp "$GRADLE_APK" release_assets/mkr-music-universal.apk

          echo "=== Generating Release Metadata (version.json) ==="
          python3 -c "
          import json
          meta = {
              'versionName': '${{ steps.version_info.outputs.version_name }}',
              'versionCode': int('${{ steps.version_info.outputs.version_code }}'),
              'packageName': 'com.kaif.music',
              'version_name': '${{ steps.version_info.outputs.version_name }}',
              'version_code': int('${{ steps.version_info.outputs.version_code }}'),
              'package_id': 'com.kaif.music',
              'min_sdk': 26,
              'target_sdk': 37
          }
          with open('release_assets/version.json', 'w') as f:
              json.dump(meta, f, indent=2)
          "
          cat release_assets/version.json

          echo "=== Generating SHA-256 Checksum ==="
          (cd release_assets && sha256sum mkr-music-universal.apk > mkr-music-universal.apk.sha256)
          SHA256_HASH=$(awk '{print $1}' release_assets/mkr-music-universal.apk.sha256)
          echo "sha256=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "SHA-256 Checksum: $SHA256_HASH"

          echo "=== Validating Universal APK Presence & Size ==="
          apk_path="release_assets/mkr-music-universal.apk"
          if [ ! -f "$apk_path" ]; then
            echo "::error::Required APK mkr-music-universal.apk is missing!"
            exit 1
          fi
          size=$(wc -c < "$apk_path")
          if [ "$size" -lt 5000000 ]; then
            echo "::error::Required APK mkr-music-universal.apk is suspiciously small ($size bytes)! Minimum expected: 5MB."
            exit 1
          fi
          echo "✓ Verified mkr-music-universal.apk ($size bytes)"

          echo "=== Verifying APK Archive Integrity ==="
          if ! unzip -tq "$apk_path"; then
            echo "::error::Universal APK archive integrity test failed! File is corrupt or truncated."
            exit 1
          fi
          echo "✓ Verified APK archive integrity (valid ZIP container)"

          echo "=== Inspecting Application ID and Manifest ==="
          AAPT_BIN=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name "aapt" -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AAPT_BIN" ] && [ -x "$AAPT_BIN" ]; then
            echo "Inspecting APK badging with: $AAPT_BIN"
            BADGING=$("$AAPT_BIN" dump badging "$apk_path")

            if echo "$BADGING" | grep -q "package: name='com.kaif.music'"; then
              echo "✓ Application ID confirmed: com.kaif.music"
            else
              echo "::error::Application ID mismatch in APK! Expected com.kaif.music"
              exit 1
            fi

            EXPECTED_VC="${{ steps.version_info.outputs.version_code }}"
            if echo "$BADGING" | grep -q "versionCode='$EXPECTED_VC'"; then
              echo "✓ Version Code confirmed in APK: $EXPECTED_VC"
            else
              echo "::error::Version Code mismatch in APK! Expected $EXPECTED_VC"
              exit 1
            fi
          else
            echo "Notice: aapt binary not directly available; verifying manifest entry in archive..."
            if ! unzip -l "$apk_path" | grep -q "AndroidManifest.xml"; then
              echo "::error::AndroidManifest.xml missing from universal APK!"
              exit 1
            fi
            echo "✓ AndroidManifest.xml verified present in APK archive"
          fi

          echo "=== Inspecting Native Multi-ABI Libraries in Universal APK ==="
          LIB_ENTRIES=$(unzip -l "$apk_path" | grep "lib/" || true)
          echo "$LIB_ENTRIES" | head -n 25 || true

          # Verify multi-ABI inclusion for all supported architectures
          HAS_ARM64=$(echo "$LIB_ENTRIES" | grep -c "lib/arm64-v8a/" || true)
          HAS_ARMV7=$(echo "$LIB_ENTRIES" | grep -c "lib/armeabi-v7a/" || true)
          HAS_X86=$(echo "$LIB_ENTRIES" | grep -c "lib/x86/" || true)
          HAS_X86_64=$(echo "$LIB_ENTRIES" | grep -c "lib/x86_64/" || true)

          echo "Architecture native libraries detected:"
          echo " - arm64-v8a:   $HAS_ARM64"
          echo " - armeabi-v7a: $HAS_ARMV7"
          echo " - x86:         $HAS_X86"
          echo " - x86_64:      $HAS_X86_64"

          if [ "$HAS_ARM64" -eq 0 ] || [ "$HAS_ARMV7" -eq 0 ] || [ "$HAS_X86" -eq 0 ] || [ "$HAS_X86_64" -eq 0 ]; then
            echo "::error::Universal APK missing required native ABIs! Expected all 4 supported architectures (arm64-v8a, armeabi-v7a, x86, x86_64)."
            exit 1
          fi
          echo "✓ Confirmed genuine universal APK: includes all 4 supported architectures (arm64-v8a: $HAS_ARM64, armeabi-v7a: $HAS_ARMV7, x86: $HAS_X86, x86_64: $HAS_X86_64 libs)"

          echo "=== Mandatory Release Signature & Certificate Fingerprint Verification ==="
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name "apksigner" -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Mandatory tool 'apksigner' not found in Android SDK build-tools! Failing workflow."
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"

          EXPECTED_CERT="${{ steps.keystore_validation.outputs.expected_cert_sha256 }}"
          if [ -z "$EXPECTED_CERT" ]; then
            echo "::error::Expected release certificate fingerprint output from keystore validation is missing!"
            exit 1
          fi

          echo "Target Expected Certificate SHA-256: $EXPECTED_CERT"

          for apk in release_assets/*.apk; do
            [ -e "$apk" ] || continue
            echo "--------------------------------------------------------"
            echo "Verifying cryptographic signature on: $apk"
            if ! "$APKSIGNER" verify --verbose "$apk"; then
              echo "::error::apksigner cryptographic signature verification failed for $apk!"
              exit 1
            fi
            echo "✓ apksigner signature verification passed for $apk"

            echo "Extracting signer certificate fingerprint from $apk..."
            APK_CERT_DIGEST=$("$APKSIGNER" verify --print-certs "$apk" | grep -i "certificate SHA-256 digest" | head -n 1 | awk '{print $NF}' | tr -d ' :' | tr '[:lower:]' '[:upper:]')

            echo "APK Signer Certificate SHA-256: $APK_CERT_DIGEST"
            echo "Expected Keystore Certificate:   $EXPECTED_CERT"

            if [ "$APK_CERT_DIGEST" != "$EXPECTED_CERT" ]; then
              echo "::error::Signer certificate mismatch on $apk! Expected $EXPECTED_CERT but found $APK_CERT_DIGEST. The APK was not signed with the intended persistent release key."
              exit 1
            fi
            echo "✓ Verified $apk is cryptographically signed with the intended persistent release key."
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mkr-music-universal-apk-v${{ steps.version_info.outputs.version_name }}
          path: |
            release_assets/mkr-music-universal.apk
            release_assets/version.json
            release_assets/mkr-music-universal.apk.sha256
          if-no-files-found: error

      - name: Write Step Summary
        run: |
          UNIVERSAL_SIZE=$(ls -lh release_assets/mkr-music-universal.apk | awk '{print $5}')
          SHA256_HASH="${{ steps.prepare_assets.outputs.sha256 }}"

          echo "## 🚀 MKR Music Build Complete — v${{ steps.version_info.outputs.version_name }} (Build ${{ steps.version_info.outputs.version_code }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The single Universal APK has been generated and validated successfully with all supported architectures:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Target ABI | Filename | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Universal** | All Supported ABIs (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86\`, \`x86_64\`) | \`mkr-music-universal.apk\` | $UNIVERSAL_SIZE | \`$SHA256_HASH\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Download Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download the compiled APK directly from the **Artifacts** section at the top of this run (\`mkr-music-universal-apk-v${{ steps.version_info.outputs.version_name }}\`)." >> $GITHUB_STEP_SUMMARY

      - name: Generate Beautiful Release Notes
        if: github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true
        env:
          VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
        shell: python
        run: |
          import os

          version_name = os.environ.get('VERSION_NAME', '')
          poster_url = f"https://raw.githubusercontent.com/mkr-infinity/mkr-music/main/assets/releases/mkr-music-v{version_name}-poster.png"

          body = f"""<p align="center">
            <img src="{poster_url}" alt="MKR Music v{version_name} Release Poster" width="100%" />
          </p>

          # MKR Music v{version_name}

          > ### Release Highlights
          >
          > Milestone release featuring unified Material 3 Expressive library views, strengthened personalized song suggestions, instant audio playback, and notification artwork styling matching source.

          ---

          ### 🎵 Smart Recommendations & Playback
          - **Strengthened Taste-Based Song Suggestions:** Deeply personalizes Quick Picks and radio queues to your listening history, favorite artists, and active moods.
          - **Always-On Quick Picks:** Pinned at top of Home with popular chart starters for new users and seamless guest fallback.
          - **Instant Audio Streaming:** Streams tracks immediately upon tap with low-latency buffering.
          - **Persistent "Not Interested" Filter:** Easily hide unwanted songs permanently from your recommendations.

          ### 🎨 UI & Library Experience
          - **Material 3 Expressive Library:** Unified Liked, Offline, Cached, and Local views with hero cards, 2x2 collage artwork, and stats pills.
          - **Numbered Track Rows:** Clean left-side track numbering, live playing visualizers, squircle thumbnails, and duration capsules.
          - **Default Modern Player & Follow Theme:** Clean modern player layout with dynamic background following current theme.
          - **Synced Notification Artwork:** Exact media notification style with dynamic album artwork colors and skip controls.
          - **Letter-by-Letter Lyrics Animation:** Smooth word and character synchronization across multiple providers.

          ### 🛠️ Reliability & Performance
          - **Background Playback Lifecycle:** Resilient audio playback service that stays alive when clearing recents.
          - **Zero Inset Overlaps:** Protected player controls and navigation bars against system cutout and gesture collisions.
          - **Universal APK:** Single consolidated release build supporting all Android device architectures.

          ---

          ### 📖 Full Changelog

          For the full list of changes and detailed breakdown, check the [CHANGELOG.md](https://github.com/mkr-infinity/mkr-music/blob/main/CHANGELOG.md) file.
          """

          with open("release_notes.txt", "w", encoding="utf-8") as f:
              f.write(body.strip())

      - name: Publish or Attach Assets to GitHub Release
        if: github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          TAG_NAME="v$VERSION_NAME"

          echo "Publishing via workflow_dispatch to tag: $TAG_NAME"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading assets with --clobber..."
            gh release upload "$TAG_NAME" release_assets/* --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" release_assets/* \
              --title "MKR Music v$VERSION_NAME" \
              --notes-file release_notes.txt \
              --target "${{ github.sha }}"
          fi
