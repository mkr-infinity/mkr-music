name: Production Release Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (Optional)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build_apks:
    name: Build & Package MKR Music APKs
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | tr -d ' ' | cut -d= -f2)
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "Extracted Version Code: $VERSION_CODE"
          echo "Extracted Version Name: $VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Check Keystore Availability
        id: check_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Custom Keystore secret detected."
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "No custom Keystore secret found. Using standard signing fallback."
          fi

      - name: Generate Signing Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MKR Music,O=MKR,C=US"

      - name: Build Universal Release APK
        run: |
          echo "Building single Universal APK variant (including all supported ABIs)..."
          ./gradlew assembleUniversalGmsRelease \
            --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Sign Universal APK with Custom Keystore
        if: steps.check_keystore.outputs.has_keystore == 'true'
        id: sign_universal
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/universalGms/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Prepare and Validate Release Assets
        id: prepare_assets
        run: |
          mkdir -p release_assets

          if [ "${{ steps.check_keystore.outputs.has_keystore }}" == "true" ]; then
            UNIVERSAL_SRC="${{ steps.sign_universal.outputs.signedFile }}"
          else
            UNIVERSAL_SRC=$(find app/build/outputs/apk/universalGms/release/ -name "*.apk" | head -n 1)
          fi

          echo "Universal source: $UNIVERSAL_SRC"

          if [ -z "$UNIVERSAL_SRC" ] || [ ! -f "$UNIVERSAL_SRC" ]; then
            echo "::error::Built Universal APK file not found!"
            exit 1
          fi

          # Copy and rename to exact required filename
          cp "$UNIVERSAL_SRC" release_assets/mkr-music-universal.apk

          echo "=== Validating Generated Universal APK ==="
          apk_path="release_assets/mkr-music-universal.apk"
          if [ ! -f "$apk_path" ]; then
            echo "::error::Required APK mkr-music-universal.apk is missing!"
            exit 1
          fi
          size=$(wc -c < "$apk_path")
          if [ "$size" -lt 1000000 ]; then
            echo "::error::Required APK mkr-music-universal.apk is suspiciously small ($size bytes)!"
            exit 1
          fi
          echo "✓ Verified mkr-music-universal.apk ($size bytes)"

          echo "=== Inspecting Native ABIs in Universal APK ==="
          unzip -l release_assets/mkr-music-universal.apk | grep "lib/" | head -n 15 || echo "No lib entries"

      - name: Generate changelog.json
        env:
          VERSION_CODE: ${{ steps.version_info.outputs.version_code }}
          VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
        shell: python
        run: |
          import os, json
          version_name = os.environ.get('VERSION_NAME')
          
          features = []
          fixes = []
          description = None
          image_url = "https://raw.githubusercontent.com/mkr-infinity/mkr-music/main/assets/banner.png"
          
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              for line in lines:
                  line_str = line.strip()
                  if line_str.startswith("- "):
                      clean_line = line_str.lstrip("*-• ").strip()
                      if "fix" in clean_line.lower() or "resolve" in clean_line.lower():
                          fixes.append(clean_line)
                      else:
                          features.append(clean_line)
          
          if not features:
              features.append("New MKR Music release with modern Material 3 Expressive UI, audio streaming improvements, and bug fixes.")
              
          description = f"MKR MUSIC v{version_name} brings new updates, instant streaming playback, and interface refinements."
                  
          changelog_sections = []
          if features:
              changelog_sections.append({
                  "title": "What's New",
                  "items": features
              })
          if fixes:
              changelog_sections.append({
                  "title": "Fixes & Improvements",
                  "items": fixes
              })
              
          changelog_sections.append({
              "title": "Support the Developer",
              "items": [
                  "💸 Support instantly via UPI: <b>mkr-infinity@ybl</b>",
                  "☕ Support via <b>Buy Me a Coffee:</b> https://buymeacoffee.com/mkr_infinity"
              ]
          })
              
          data = {
              "version": version_name,
              "description": description,
              "image": image_url,
              "changelog": changelog_sections
          }
          
          with open("release_assets/changelog.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mkr-music-universal-apk
          path: |
            release_assets/mkr-music-universal.apk
            release_assets/changelog.json
          if-no-files-found: error

      - name: Write Step Summary
        run: |
          UNIVERSAL_SIZE=$(ls -lh release_assets/mkr-music-universal.apk | awk '{print $5}')

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 MKR Music Build Complete

          The single Universal APK has been generated and packaged successfully with all supported architectures:

          | Variant | Target ABI | Filename | Size |
          | :--- | :--- | :--- | :--- |
          | **Universal** | All Supported ABIs (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86\`, \`x86_64\`) | \`mkr-music-universal.apk\` | $UNIVERSAL_SIZE |

          ### 📦 Download Artifacts
          Download the compiled APK directly from the **Artifacts** section at the top of this run (\`mkr-music-universal-apk\`).
          EOF

      - name: Generate Beautiful Release Notes
        if: github.event.inputs.publish_release == 'true'
        env:
          VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
        shell: python
        run: |
          import os

          version_name = os.environ.get('VERSION_NAME', '')
          banner_url = "https://raw.githubusercontent.com/mkr-infinity/mkr-music/main/assets/banner.png"

          body = []
          # 1. Project poster banner at first
          body.append(f'<p align="center">\n  <img src="{banner_url}" alt="MKR Music Banner" width="100%" />\n</p>\n')
          body.append(f"# 🎵 MKR Music v{version_name}\n")

          # 2. Release Notes directly from CHANGELOG.md
          notes_content = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              extracted = []
              recording = False
              for line in lines:
                  if line.startswith("## "):
                      if not recording:
                          recording = True
                          continue
                      else:
                          break
                  if recording:
                      if line.strip().startswith("---"):
                          break
                      extracted.append(line)
              notes_content = "".join(extracted).strip()

          if notes_content:
              body.append(notes_content)
          else:
              body.append("New release of MKR Music featuring playback performance enhancements, streamlined updates, and UI refinements.")

          # 3. Support section
          body.append("\n---\n")
          body.append("### 💖 Support Development\n")
          body.append("MKR Music is free and open-source. If you enjoy the app, consider supporting the project:\n")
          body.append("- ☕ **Buy Me a Coffee**: https://buymeacoffee.com/mkr_infinity\n")
          body.append("- 💸 **UPI**: `mkr-infinity@ybl`\n")

          with open("release_notes.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(body))

      - name: Create GitHub Release & Upload Assets
        if: github.event.inputs.publish_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          
          # Delete existing release/tag with same name if it exists so re-running works cleanly
          gh release delete "v$VERSION_NAME" --yes || true
          git tag -d "v$VERSION_NAME" 2>/dev/null || true
          git push --delete origin "v$VERSION_NAME" 2>/dev/null || true

          gh release create "v$VERSION_NAME" release_assets/* \
            --title "MKR Music v$VERSION_NAME" \
            --notes-file release_notes.txt \
            --target main

